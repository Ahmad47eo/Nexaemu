name: Build NexaEmu from Fin engine

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout NexaEmu
        uses: actions/checkout@v4

      - name: Install Fin build tools
        run: brew install cmake ninja bartycrouch

      - name: Clone Fin
        run: git clone --depth 1 --recurse-submodules https://github.com/MuffinFluffin/Fin.git third_party/Fin

      - name: Patch Fin CMake for iOS
        working-directory: third_party/Fin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Source/Core/InputCommon/CMakeLists.txt")
          s = p.read_text()
          old = "if(UNIX)\n  target_sources(inputcommon PRIVATE"
          new = "if(UNIX AND NOT IOS)\n  target_sources(inputcommon PRIVATE"
          if old not in s:
              raise SystemExit("Expected Pipes block not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build Fin engine/app
        working-directory: third_party/Fin
        run: |
          xcodebuild \
            -project Source/iOS/App/Fin.xcodeproj \
            -scheme Fin \
            -configuration "Release" \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$GITHUB_WORKSPACE/build/Fin" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Fin engine as NexaEmu IPA
        run: |
          APP="build/Fin/Build/Products/Release-iphoneos/Fin.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName NexaEmu" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName NexaEmu" "$APP/Info.plist" || true
          rm -rf Payload NexaEmu.ipa
          mkdir Payload
          cp -R "$APP" Payload/NexaEmu.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NexaEmu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaEmu-Fin-engine-IPA
          path: NexaEmu.ipa
          if-no-files-found: error
