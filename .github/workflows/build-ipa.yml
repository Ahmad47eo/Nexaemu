name: Build NexaEmu

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout NexaEmu
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native build tools
        run: brew install cmake ninja bartycrouch

      - name: Fetch DolphiniOS
        run: |
          rm -rf third_party/dolphin-ios
          git clone --depth 1 --recurse-submodules https://github.com/OatmealDome/dolphin-ios.git third_party/dolphin-ios
          git -C third_party/dolphin-ios rev-parse HEAD
          test -f third_party/dolphin-ios/Source/iOS/App/DolphiniOS.xcodeproj/project.pbxproj

      - name: Build NexaEmu frontend
        run: |
          xcodebuild             -project NexaEmu.xcodeproj             -scheme NexaEmu             -configuration Release             -sdk iphoneos             -derivedDataPath build/NexaEmu             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Build DolphiniOS engine target
        working-directory: third_party/dolphin-ios
        run: |
          xcodebuild             -project Source/iOS/App/DolphiniOS.xcodeproj             -scheme "DiOS (NJB)"             -configuration "Release (Non-Jailbroken)"             -sdk iphoneos             -derivedDataPath "$GITHUB_WORKSPACE/build/DolphiniOS"             -destination generic/platform=iOS             DOL_PBID_ORGANIZATION_IDENTIFIER="com.ahmad47eo"             DOL_BUILD_SOURCE="nexaemu"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package NexaEmu frontend IPA
        run: |
          rm -rf Payload NexaEmu.ipa
          mkdir -p Payload
          cp -R build/NexaEmu/Build/Products/Release-iphoneos/NexaEmu.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NexaEmu.ipa

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexaEmu-build
          path: |
            NexaEmu.ipa
            build/DolphiniOS/Build/Products/Release-Non-Jailbroken-iphoneos/DolphiniOS.app
          if-no-files-found: error
