name: Build NexaEmu

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout NexaEmu
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          brew install cmake ninja

      - name: Fetch Dolphin iOS source
        run: |
          git clone --depth 1 https://github.com/OatmealDome/dolphin-ios.git third_party/dolphin-ios

      - name: Build NexaEmu
        run: |
          xcodebuild \
            -project NexaEmu.xcodeproj \
            -scheme NexaEmu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload NexaEmu.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexaEmu.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NexaEmu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaEmu-unsigned-IPA
          path: NexaEmu.ipa
          if-no-files-found: error
