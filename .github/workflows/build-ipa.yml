name: Build NexaEmu from Fin engine
# Trigger build on push, PR, manual, or repository dispatch

on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout NexaEmu
        uses: actions/checkout@v4

      - name: Install Fin build tools
        run: brew install cmake ninja bartycrouch

      - name: Clone Fin
        run: git clone --depth 1 --recurse-submodules https://github.com/MuffinFluffin/Fin.git third_party/Fin

      - name: Patch Fin CMake for iOS
        working-directory: third_party/Fin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("Source/Core/InputCommon/CMakeLists.txt")
          s = p.read_text()
          old = "if(UNIX)\n  target_sources(inputcommon PRIVATE"
          new = "if(UNIX AND NOT IOS)\n  target_sources(inputcommon PRIVATE"
          if old not in s:
              raise SystemExit("Expected Pipes block not found")
          p.write_text(s.replace(old, new, 1))

          ci = Path("Source/Core/InputCommon/ControllerInterface/ControllerInterface.cpp")
          s = ci.read_text()
          include = '#include "InputCommon/ControllerInterface/Pipes/Pipes.h"'
          if include not in s:
              raise SystemExit("Expected Pipes include not found")
          s = s.replace(include, '#if !defined(IPHONEOS)\n#include "InputCommon/ControllerInterface/Pipes/Pipes.h"\n#endif', 1)

          call = "m_input_backends.emplace_back(ciface::Pipes::CreateInputBackend(this));"
          if call not in s:
              raise SystemExit("Expected Pipes backend call not found")
          s = s.replace(call, '#if !defined(IPHONEOS)\n  m_input_backends.emplace_back(ciface::Pipes::CreateInputBackend(this));\n#endif', 1)

          # Fin's Metal shader path must keep the framebuffer-fetch input attachment
          # on a distinct Metal texture slot from the 8 regular pixel samplers.
          metal = Path("Source/Core/VideoBackends/Metal/MTLUtil.mm")
          s = metal.read_text()
          old_binding = "MakeResourceBinding(spv::ExecutionModelFragment, 1, 0, 0, 16, 0), // ps/input attachment (framebuffer fetch)"
          new_binding = "MakeResourceBinding(spv::ExecutionModelFragment, 1, 0, 0, 8, 0), // ps/input attachment (framebuffer fetch)"
          if old_binding not in s:
              raise SystemExit("Expected Metal framebuffer-fetch binding not found")
          s = s.replace(old_binding, new_binding, 1)
          metal.write_text(s)

          ci.write_text(s if False else ci.read_text())
          PY

      - name: Build Fin engine/app
        working-directory: third_party/Fin
        run: |
          xcodebuild \
            -project Source/iOS/App/Fin.xcodeproj \
            -scheme Fin \
            -configuration "Release" \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$GITHUB_WORKSPACE/build/Fin" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Fin engine as NexaEmu IPA
        run: |
          APP="build/Fin/Build/Products/Release-iphoneos/Fin.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName NexaEmu" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName NexaEmu" "$APP/Info.plist" || true
          rm -rf Payload NexaEmu.ipa
          mkdir Payload
          cp -R "$APP" Payload/NexaEmu.app
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NexaEmu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaEmu-Fin-engine-IPA
          path: NexaEmu.ipa
          if-no-files-found: error
