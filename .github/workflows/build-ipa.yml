name: Build NexaEmu IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild             -project NexaEmu.xcodeproj             -scheme NexaEmu             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package IPA
        run: |
          rm -rf Payload NexaEmu.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NexaEmu.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload NexaEmu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexaEmu-unsigned-IPA
          path: NexaEmu.ipa
          if-no-files-found: error
